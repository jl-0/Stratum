# The EMIT plugin distribution. It is a SEPARATE distribution from `stratum` on purpose: this is
# the shape every project-specific plugin package takes, and the framework must meet it the same
# way a third party's would - through entry points, never an import (ADR-0003).
#
# Nothing here is Terraform's business. A plugin reaches a deployment by being installed into the
# image (`make image`) or, later, by a wheel URI in the manifest (04 section 7). Both record
# themselves in provenance; neither needs an infrastructure change.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratum-emit"
version = "0.0.1"
description = "EMIT readers, instrument masks and mineral scorers for Stratum"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "stratum>=0.0.1",
  "numpy>=1.26",
  "netCDF4>=1.6,<1.7.1",
  # the GeoTIFF reader and the ortho role path open rasters directly; `stratum` depends on
  # rasterio too, but a reader's core import must not rest on a transitive dependency
  "rasterio>=1.3",
]

# Plugin registration - spec 04 section 7. Names are what a manifest `ref` uses. These moved here
# from the core pyproject with the split: the collection readers, the instrument masks and the
# mineral scorers are all EMIT knowledge, and `stratum` must not ship them.
[project.entry-points."stratum.scorers"]
min_view_zenith   = "stratum_emit.scorers:MinViewZenith"
cleanest_nadir    = "stratum_emit.scorers:CleanestNadir"
prefer_bare_earth = "stratum_emit.scorers:PreferBareEarth"
max_band_depth    = "stratum_emit.scorers:MaxBandDepth"

[project.entry-points."stratum.masks"]
edge_trim     = "stratum_emit.masks:EdgeTrim"
slit_dust     = "stratum_emit.masks:SlitDust"
l2a_standard  = "stratum_emit.masks:L2AStandard"
soil_fraction = "stratum_emit.masks:SoilFraction"
landcover     = "stratum_emit.masks:Landcover"

[project.entry-points."stratum.readers"]
EMITL2BMIN   = "stratum_emit.readers:L2BMin"
EMITL1BRAD   = "stratum_emit.readers:L1BRad"
EMITL2AMASK  = "stratum_emit.readers:L2AMask"
EMITL2BFRCOV = "stratum_emit.readers:L2BFrcovTiff"

[tool.hatch.build.targets.wheel]
packages = ["src/stratum_emit"]
