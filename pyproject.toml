[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratum"
version = "0.0.1"
description = "Cost-function-driven mosaic engine for imaging spectroscopy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.5",
  "click>=8.1",
  "pyarrow>=15",
  "pandas>=2.1",
  "shapely>=2.0",
  "affine>=2.4",
  "pyyaml>=6",
  "xarray>=2024.1",
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "scipy>=1.11",
  "duckdb>=0.10",
  "earthaccess>=0.9",
  # the storage root may be a bucket (stratum.storage); imported lazily, never on a
  # local run
  "boto3>=1.34",
  # terminal rendering of the plan report; the CLI degrades to plain text without a tty
  "rich>=13",
  "netCDF4>=1.6,<1.7.1",
  # spectral-util is NOT listed here: it has no PyPI release, and a non-editable install of
  # the upstream repo ships no subpackages (its pyproject lists packages = ["spectral_util"]
  # only). It comes from the vendor/SpectralUtil submodule via pixi - ADR-0001 section 3.
]

[project.scripts]
stratum = "stratum.cli:main"

# Plugin registration - spec 04 section 7. Names are what a manifest `ref` uses. Only the two
# catalogue sources are registered here: they are framework machinery. Every EMIT scorer, mask and
# reader is registered by the `stratum-emit` distribution under plugins/, which this package must
# not depend on and does not import.
[project.entry-points."stratum.sources"]
cmr   = "stratum.access.sources:CMRSource"
local = "stratum.access.sources:LocalSource"

[tool.hatch.build.targets.wheel]
packages = ["src/stratum"]

# ---- environment: pixi / conda-forge (ADR-0001 section 2) ----
[tool.pixi.workspace]
channels = ["conda-forge"]
# linux-aarch64 is the container image target: Lambda runs arm64 (Graviton), which is also
# native on an Apple-silicon laptop, so `make image` builds without emulation and the image
# resolves from this same lock file (ADR-0003).
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.11.*"
gdal = "*"
netcdf4 = "<1.7.1"
rasterio = "*"
rioxarray = "*"
xarray = "*"
numpy = "*"
scipy = "*"
pyarrow = "*"
pandas = "*"
shapely = "*"
duckdb = "*"
pydantic = ">=2.5"
click = "*"
pyyaml = "*"
affine = "*"
earthaccess = "*"
boto3 = "*"
rich = "*"
# pip is here for the image build only: the Lambda Runtime Interface Client is a pip-only,
# Linux-only package and must not enter the lock for every platform (ADR-0003).
pip = "*"
pytest = "*"
ruff = "*"

[tool.pixi.pypi-dependencies]
stratum = { path = ".", editable = true }
# The EMIT plugin is a separate distribution installed beside the framework - the same way a
# project's own plugin package is installed into the image (ADR-0003).
stratum-emit = { path = "plugins/stratum-emit", editable = true }
# The KD-tree regrid is wrapped, not forked (spec 03 section 4). The submodule pins the
# commit; editable because upstream's non-editable build drops its subpackages.
spectral-util = { path = "vendor/SpectralUtil", editable = true }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check src plugins tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["trial_data: needs granules under trial-data/ or STRATUM_TRIAL_DATA"]

[tool.ruff]
line-length = 100
target-version = "py311"
