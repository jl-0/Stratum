# PROOF RUN: band depth x the constituent's XRD fraction, applied PER EPOCH before the temporal
# aggregation, with one constituent allowed to reach several output classes.
#
#     pixi run stratum run -m examples/emit-us-west-2025/manifest-proof-abundance.yaml
#
# The two things an Enumeration cannot express, from the 17 Sep 2026 tag-up:
#   "I would absolutely apply the mineral abundance calculations a priori... 294 binary to a 13
#    component continuous basis"        -> the multiply happens per epoch, inside the reducer
#   "some of the samples are shared between those categories, so we just split out"
#                                       -> `nHematit+fg-Goethit` contributes 0.10 goethite AND
#                                          0.05 hematite; `classes.py:resolve` refuses that
#
# Weights are the real EMIT-10 XRD columns of the reference matrix, keyed by the constituent name
# the granule's own /mineral_metadata reports - never by the integer index.
#
#     pixi run stratum run -m examples/emit-us-west-2025/manifest-proof.yaml
#
# manifest.yaml is a 1.7 TB continental job, so it cannot be the thing that demonstrates the
# grouping machinery actually executes. This runs the SAME schema - both mineral groups as
# separate mosaics, three enumerations over the same detections, band depth conditioned per
# group - over the single tile Cuprite sits in, for the same calendar year, reusing
# ../emit-cmr-cuprite/'s index and asset store so it downloads nothing.
#
# Differences from manifest.yaml, and only these:
#   - one 0.5 deg tile instead of 1,323 one-degree tiles
#   - no `mask` role: the Cuprite index was built without EMITL2AMASK, so `l2a_standard` cannot
#     run here. Adding it means re-indexing and ~4.4 GB more download.
#   - 4 WorldCover aux tiles instead of 153, in the order manifest-bare-earth.yaml uses, so the
#     staged and warped aux is a cache hit
#   - gtiff instead of cog, to be looked at

run_id: us-west-2025-proof-abundance
description: One tile, all of 2025 - spectral abundance, band depth x XRD fraction, per epoch

grid:
  crs: EPSG:4326
  resolution: [0.000277777777777778, -0.000277777777777778]
  origin: [-180, -90]
  tile_size: 0.5
  block_size: 450
  max_distance: 0.00059
  regrid_method: kdtree

aoi:
  tiles: [[-235, 75]]             # lon [-117.5, -117.0), lat [37.5, 38.0) - Cuprite

time:
  start: 2025-01-01
  end:   2026-01-01
  epoch: P1M
  deliver: P1Y

inputs:
  index_location: ../emit-cmr-cuprite/index     # built already; nothing is queried
  source:
    kind: cmr
    provider: LPCLOUD
    prefer: https
    patterns:
      EMITL2BMIN:
        MIN: "EMIT_L2B_MIN_001_*.nc"
      EMITL1BRAD:
        OBS: "EMIT_L1B_OBS_001_*.nc"
      EMITL2BFRCOV:
        FRCOVBARE: "EMIT_L2B_FRCOVBARE_001_*.tif"
  roles:
    geometry: {collection: EMITL1BRAD, asset: OBS, var: obs}
    mineral_1:
      collection: EMITL2BMIN
      var: group_1_mineral_id
      class_table: {source: embedded, path: /mineral_metadata, key: index,
                    attributes: [name, record, library, group, url]}
    depth_1: {collection: EMITL2BMIN, var: group_1_band_depth}
    mineral_2:
      collection: EMITL2BMIN
      var: group_2_mineral_id
      class_table: {source: embedded, path: /mineral_metadata, key: index,
                    attributes: [name, record, library, group, url]}
    depth_2: {collection: EMITL2BMIN, var: group_2_band_depth}
    frcov:
      collection: EMITL2BFRCOV
      asset: FRCOVBARE
      var: EMIT_L2B_FRCOVBARE
      resampling: bilinear
  band_aliases:
    view_zenith:  {role: geometry, band: 2}
    solar_zenith: {role: geometry, band: 4}

aux:
  landcover:
    uri:
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N36W120_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N36W117_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N39W120_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N39W117_Map.tif
    kind: categorical
    resampling: mode

granule_filter:
  - {max_cloud_fraction: 0.5, on_missing: fail}
  - {max_solar_zenith: 70}

pixel_mask:
  - {ref: edge_trim, columns: 7}
  - {ref: landcover, exclude: [water, built-up]}
  - {ref: soil_fraction, min_soil: 0.65}

scorer:
  ref: prefer_bare_earth
  params: {hard_floor: 0.65, min_soil: 0.80, sun_weight: 0.25}

reducer:
  ref: spectral_abundance
  params:
    mineral: mineral_1_native     # the layer whose winning class names a library constituent
    depth: depth_1                # that group's band depth
    method: median                # over the epochs in which the class was DETECTED, never the zeros
    min_epochs: 2
    classes: [goethite, hematite]
    weights:                      # INLINE, not a file reference: reducer params are free-form
                                  #   by contract, so there is no `@ref:` for them. Generated
                                  #   from weights/abundance-group1-v1.yaml, which is the
                                  #   provenance record for these 26 numbers and is read by
                                  #   nothing. This copy is what hashes and what a worker sees.
      "Hematite.02+Quartz.98 GDS76 W1R1Ha": {hematite: 0.02}
      "Goethite WS222 <250um MedGrn W1R1H_ AREF": {goethite: 1.0}
      "Goethite0.02+Quartz GDS240 W1R1Ba": {goethite: 0.02}
      "Goethite MPCMA2-B FineGr adj W1R1Bb": {goethite: 0.2}
      "Goethite MPCMA2-C M-Crsgrad2 W1R1Hb AREF": {goethite: 0.37}
      "Goethite WS222 coarse grain W1R1H_": {goethite: 1.0}
      "Goethite_Thin_Film WS222 W1R1Ba": {goethite: 0.1}
      "Goeth+qtz.5+Jarosite.5 AMX11 W1R1BbS": {goethite: 0.02}
      "Lepidocrosite GDS80 (Syn) W1R1Hb": {goethite: 1.0}
      "Goethite CU91-252 coatedchip W1R1H_": {goethite: 0.04}
      "Chlor+Goethite CU93-4B Phyl W1R1Ba": {goethite: 0.02}
      "Fe-Hydroxide SU93-106 amorph W1R1Bb": {goethite: 0.2}
      "Hematite GDS27 W1R1Ha": {hematite: 1.0}
      "Hematite_Thin_Film GDS27 W1R1Ba": {hematite: 0.05}
      "Hematite FE2602 W1R1Bb": {hematite: 1.0}
      "Hematite WS161 W1R1Hb": {hematite: 0.79}
      "Magnetite_skarn BR93-5B W1R1Hb AREF": {hematite: 0.17}
      "Basalt_weathered BR93-43 W1R1Bb": {hematite: 0.01}
      "Hematite_Coatd_Qtzt BR93-25A W1R1Hb AREF": {hematite: 0.01}
      "Hematite_Coatd_Qtz BR93-25B W1R1Bb": {hematite: 0.05}
      "Hematite_Coatd_Qtzt BR93-25C W1R1Hb AREF": {hematite: 0.69}
      "Nanohematite BR93-34B2 W1R1BbS": {hematite: 0.1}
      "nHematit+fg-Goethit 34B2+MPC W1R1Hb": {goethite: 0.1, hematite: 0.05}
      "Nanohematite FBR93-34B2b ed1 W1R1Hb": {hematite: 0.1}
      "Hematite_Coatd_Qtz BR93-34C W1R1Ha AREF": {hematite: 0.63}
      "Maghemite GDS81 Syn (M-3) W1R1Bb": {hematite: 0.85}

snapshot:
  name: us-west-2025-grouping-v1
  layers:
    mineral_1_native:
      kind: categorical
      source: mineral_1
      classes: source
      aggregate: {method: vote, min_count: 3, ignore: [none], tie_break: highest_score}
    depth_1:
      kind: continuous
      source: depth_1
      aggregate: {method: median, conditional_on: mineral_1_native, spread: iqr}
    view_zenith:
      kind: continuous
      source: view_zenith
      aggregate: {method: none}

outputs:
  bucket: ../emit-cmr-cuprite/out
  formats: [gtiff]
  stac: true
  # NO `render:`. A reducer plugin's bands are not schema layers, and `outputs.render` names
  # a schema layer - so the abundance bands ship as data with no baked RGBA. A known limit.

budget:
  max_tiles: 1
  max_granules: 110
  max_vcpu_hours: 2
  on_exceed: fail
