# Stratum example: the Critical Minerals GROUPING product, the eleven western states, all of 2025.
#
#     pixi run stratum validate -m examples/emit-us-west-2025/manifest.yaml   # no data, no login
#     pixi run stratum plan     -m examples/emit-us-west-2025/manifest.yaml   # needs Earthdata login
#     make cloud-run MANIFEST=examples/emit-us-west-2025/manifest.yaml        # needs the deployment
#
# Written against the 17 Sep 2026 Critical Minerals tag-up. It exists to answer one question with
# a running configuration instead of a slide: how much of the product the science leads described
# is expressible in the manifest today? Read README.md here for the answer and for what is NOT.
#
# The west is a third of CONUS's tiles and a quarter of its work, because the arid west is far
# clearer: MEDIAN CLOUD COVER IS 39 % HERE against CONUS's 65 %, so the filters keep 56 % of the
# granules rather than 42 %. Measured against CMR on 17 Sep 2026, not estimated:
#
#   1,932 granules | 402 tiles | 9,233 regrid | 59,325 resolve | 10,050 reduce | 402 publish
#   ~442 GB of granules | ~845 GB of S3 at peak | ~$33-92 of Lambda | ~85-193 CPU-hours
#
# Still an `--executor aws` run - 79,010 work items - but a cheap one. Full CONUS is the same
# manifest with `aoi.bbox: [-125, 24, -66, 50]`, the 153-tile WorldCover list, and roughly 4x
# everything; see README.md section 3.

run_id: us-west-2025-grouping-r1
description: US West 2025 annual mineral grouping - group 1 and group 2 as separate mosaics, three
  enumerations over the same detections

grid:
  crs: EPSG:4326
  resolution: [0.000277777777777778, -0.000277777777777778]   # one arcsecond, the delivered grid
  origin: [-180, -90]
  tile_size: 1.0                  # a one-degree tile is 3600 x 3600 cells - the DELIVERED tiling,
                                  #   not the half-degree the Cuprite examples use to stay small
  block_size: 720                 # 5 x 5 = 25 blocks per tile
  max_distance: 0.00059           # regrid cutoff; ~1.5x the grid diagonal (03 section 3)
  regrid_method: kdtree

aoi:
  # The eleven western states - WA OR CA, ID NV UT AZ, MT WY CO NM - as one box. 23 x 18 = 414
  # nominal one-degree tiles; 402 are touched by a granule that survives the filters (measured),
  # and a tile no granule reaches produces no work. The box takes in slivers of TX, OK, KS, NE
  # and SD east of -102 and a little of Baja and Sonora south of 31; that is deliberate, because
  # cutting to state polygons would need a vector AOI, which is not built (05 section 7).
  bbox: [-125.0, 31.0, -102.0, 49.0]

time:
  start: 2025-01-01               # inclusive, UTC
  end:   2026-01-01               # exclusive - one calendar year
  epoch: P1W                      # the voting unit. WEEKLY, not monthly: EMIT's revisit is
                                  #   clustered, so two looks in one month collapse to ONE vote
                                  #   under a monthly epoch - the scorer picks the better and the
                                  #   other is discarded. Measured on the pilot tile, halving the
                                  #   epoch recovered +16 % of classified area in group 1 and
                                  #   +22 % in group 2 at the same min_count, so weekly recovers
                                  #   more again. A year is 52 weeks and a day, so the 53rd
                                  #   (partial) epoch is dropped and plan says so - 09 section 5.
  deliver: P1Y                    # one product per tile for the year. CALENDAR-ALIGNED and ANNUAL,
                                  #   both settled at the tag-up: "calendar aligned is easy since
                                  #   it's global because seasonal is going to be kind of chaotic".
                                  #
                                  # Adding 2026 later does NOT reprocess 2025: epoch snapshots are
                                  # cached per (tile, epoch, block) and a widened window re-reads
                                  # them (06 section 2, section 5). That is the "combine them at a
                                  # higher level and not reprocess everything" ask, and it holds
                                  # only while the scorer, masks and schema hash the same.

inputs:
  index_location: ./index
  source:
    kind: cmr
    provider: LPCLOUD
    prefer: https
    patterns:
      EMITL2BMIN:
        MIN: "EMIT_L2B_MIN_001_*.nc"          # 42 MB. MINUNCERT (44 MB) is NOT listed: it doubles
                                              #   the L2B bytes and nothing below reads it. Add it
                                              #   back to use `inverse_variance` on the depths.
      EMITL1BRAD:
        OBS: "EMIT_L1B_OBS_001_*.nc"          # 109 MB. The 1.85 GB RAD file is deliberately absent.
      EMITL2AMASK:
        MASK: "EMIT_L2A_MASK_002_*.nc"        # 49 MB - "the mask layer, which is not applied yet"
      EMITL2BFRCOV:
        FRCOVBARE: "EMIT_L2B_FRCOVBARE_001_*.tif"   # 2 MB - the vegetation/bare-soil component
  roles:
    geometry: {collection: EMITL1BRAD, asset: OBS, var: obs}

    # ---- group 1: ~1 micron, electronic absorptions (iron oxides, Fe silicates) --------------
    mineral_1:
      collection: EMITL2BMIN
      var: group_1_mineral_id
      class_table:
        source: embedded
        path: /mineral_metadata
        key: index
        attributes: [name, record, library, group, url]
    depth_1: {collection: EMITL2BMIN, var: group_1_band_depth}

    # ---- group 2: 2.0-2.5 micron, vibrational overtones (clays, micas, carbonates, sulfates) --
    # A SEPARATE role, a separate set of layers, and a separate product band. The tag-up settled
    # this: "the detections between group one and group 2 are independent from one another... you
    # cannot swap in a group 2 if a group one is absent". Two mosaics, never one.
    mineral_2:
      collection: EMITL2BMIN
      var: group_2_mineral_id
      class_table:
        source: embedded
        path: /mineral_metadata
        key: index
        attributes: [name, record, library, group, url]
    depth_2: {collection: EMITL2BMIN, var: group_2_band_depth}

    mask: {collection: EMITL2AMASK, version: "002", var: mask}
    frcov:
      collection: EMITL2BFRCOV
      asset: FRCOVBARE
      var: EMIT_L2B_FRCOVBARE
      resampling: bilinear
  band_aliases:
    view_zenith:  {role: geometry, band: 2}   # 0-based into `obs`: 2 = to-sensor zenith
    solar_zenith: {role: geometry, band: 4}   #                     4 = to-sun zenith

aux:
  # THE LAND/WATER BOUNDARY. ESA WorldCover 10 m v200, public and anonymous, delivered as 3 x 3
  # degree tiles - so the western box needs 53 of them (the 3 of the 56 candidates that would be
  # all ocean are not published and are not listed). 3.93 GB staged and digested at PLAN time,
  # then warped once per tile; a source that does not intersect a tile is skipped without being
  # read. Full CONUS is the same key with 153 URIs and 10.2 GB.
  #
  # This is the mask Phil described as needed and unavailable - "I don't have a good product that
  # sits out for water masks right now". It is a STATIC land-cover water class, not a per-scene
  # liquid-water detection, so it will not catch a flooded playa; the L2A `water` flag below is
  # what catches that, per scene, and the monthly vote is what keeps one flood from deciding a
  # cell's year.
  landcover:
    uri:
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N30W105_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N30W108_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N30W111_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N30W114_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N30W117_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N30W120_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N33W105_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N33W108_Map.tif
