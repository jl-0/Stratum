      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N42W126_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N45W105_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N45W108_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N45W111_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N45W114_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N45W117_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N45W120_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N45W123_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N45W126_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N48W105_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N48W108_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N48W111_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N48W114_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N48W117_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N48W120_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N48W123_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N48W126_Map.tif
    kind: categorical
    resampling: mode              # 10 m -> 1 arcsec is a 3.3x downsample; `mode` is the honest one

granule_filter:
  - {max_cloud_fraction: 0.5, on_missing: fail}
  - {max_solar_zenith: 70}      # barely bites here - measured, 0.1 % of granules - but it is what
                                  #   stops a winter high-latitude scene winning a cell

pixel_mask:
  - {ref: edge_trim, columns: 7}                       # sensor-space: detector edges
  - {ref: l2a_standard, flags: [cloud, cirrus, water, spacecraft, dilated_cloud]}
  - {ref: landcover, exclude: [water, built-up]}       # map-space, from the aux above.
                                  # `tree` is NOT excluded here, unlike the Cuprite example: over
                                  # CONUS that would blank the whole east, and `soil_fraction`
                                  # already drops a closed canopy on the evidence rather than on
                                  # a 2021 land-cover label.
  - {ref: soil_fraction, min_soil: 0.65}               # the vegetation component, per observation

scorer:
  ref: bare_earth_nadir           # within a month: the best-exposed, best-lit, most nadir look wins
  params:
    hard_floor: 0.65              # below this the grain-size retrieval falls apart: NaN, meaning
                                  #   this observation may not occupy the cell at all
    min_soil: 0.80                # the bar recommended for mosaicking, kept SEPARATE from the
                                  #   floor so 0.65-0.80 still ranks instead of being discarded
    sun_weight: 0.25              # illumination breaks ties among comparable ground
    nadir_weight: 0.10            # so does look geometry. Measured on one tile over 2025:
                                  #   adding this term recovers 0.36 deg of the 1.57 deg that
                                  #   `prefer_bare_earth` gives away, and drops the fraction of
                                  #   cells taking a >2 deg worse look from 34 % to 26 %, at no
                                  #   cost to illumination or coverage. It changes the mineral
                                  #   label on 0.08 % of cells - a tile-continuity knob, not a
                                  #   correctness fix. 0 reproduces `prefer_bare_earth` exactly.

# NO `reducer:`. `joint_mineral_vote` exists and works, and this manifest deliberately does not
# use it: it answers a cell from group 2 where group 2 voted and from group 1 where it did not,
# which is exactly what the 17 Sep tag-up ruled out. It stays in the repository as the proof that
# a plugin can combine two categorical layers; it is not this product's reducer.

snapshot:
  name: us-west-2025-grouping-v1
  layers:
    # ---- the pre-grouping core, both groups. "We would need to retain the mosaic of the level 2B
    # mineralogy itself before grouping... that is what people want."  `classes: source` means the
    # granules' own 294-entry table IS the product table: no lumping, nothing thrown away, and one
    # band rather than 294 because Tetracorder assigns at most one constituent per group per pixel.
    mineral_1_native:
      kind: categorical
      source: mineral_1
      classes: source
      aggregate: {method: vote, min_count: 3, ignore: [none], tie_break: highest_score}
                                  # 3 agreeing WEEKS now, not months
    mineral_2_native:
      kind: categorical
      source: mineral_2
      classes: source
      aggregate: {method: vote, min_count: 3, ignore: [none], tie_break: highest_score}

    # ---- THREE GROUPINGS OVER THE SAME DETECTIONS. "The only way to do this is to basically flood
    # it and give multiple different groupings available."  Each is an independent enumeration and
    # an independent vote; none of them is privileged, and adding a fourth is a YAML file.
    iron_oxide:                   # group 1, by mineral: goethite / hematite / jarosite first
      kind: categorical
      source: mineral_1
      classes: "@ref:classes/iron-oxide-v1.yaml"
      aggregate: {method: vote, min_count: 3, ignore: [none], tie_break: highest_score}
    alteration:                   # group 2, by alteration assemblage - the deposit-system cut
      kind: categorical
      source: mineral_2
      classes: "@ref:classes/alteration-v1.yaml"
      aggregate: {method: vote, min_count: 3, ignore: [none], tie_break: highest_score}
    mineral_family:               # group 2, by plain mineral family - the same rows, cut differently
      kind: categorical
      source: mineral_2
      classes: "@ref:classes/mineral-family-v1.yaml"
      aggregate: {method: vote, min_count: 3, ignore: [none], tie_break: highest_score}

    # ---- band depth, carried per group and conditioned on that group's own winner. This is the
    # "how much?" the tag-up insisted on - "they care about it, they just don't know it yet" - but
    # it is the RAW band depth, not the band depth times an XRD fraction. The pre-multiplication
    # Phil wants applied a priori is the one thing here the manifest cannot say: see README.md
    # section 4, gap 1.
    depth_1:
      kind: continuous
      source: depth_1
      aggregate: {method: median, conditional_on: mineral_1_native, spread: iqr}
    depth_2:
      kind: continuous
      source: depth_2
      aggregate: {method: median, conditional_on: mineral_2_native, spread: iqr}
    # MANY BANDS FROM WHICHEVER GRANULE WON THE CELL. One layer with a band axis, four bands of
    # the 11-band L1B OBS cube - 13 section 2: "a reflectance mosaic is one layer, not several
    # hundred". 0-based indices into `obs`:
    #   0 = path length (m)   2 = to-sensor zenith   4 = to-sun zenith   9 = UTC time (hours)
    #
    # These come from the SAME observation that won the cell, not from four independent
    # selections: resolve computes one boolean `take` mask from the scorer and writes every
    # layer under it (`src/stratum/resolve/block.py`). Verified - band 1 here is bit-identical
    # to a separately declared single-band `view_zenith` layer across 2.18 M cells, and every
    # delivered UTC hour matches a real granule acquisition time.
    #
    # `method: best` takes the best-SCORING epoch. Note that the categorical layers above use
    # `vote`, which takes the MODAL epoch, and those can differ - so this stack is coherent
    # within its own observation but is not guaranteed to be the epoch that supplied
    # `mineral_1_native`. Use `conditional_on` where that matters, as `depth_1` does.
    geometry_stack:
      kind: continuous
      source: geometry
      bands: [0, 2, 4, 9]
      aggregate: {method: best}

outputs:
  bucket: ./out
  formats: [cog]
  stac: true
  render:
    # The ungrouped layers too. 294 classes is a busy legend and the deterministic palette
    # is the only sane way to colour it, but a picture of the raw detections is what tells you
    # whether a grouping threw something away - so it ships beside them rather than instead.
    mineral_1_native:
      mapper: categorical
      on_unmapped: grey
      alpha_from: {band: mineral_1_native_agreement, domain: [0.25, 1.0], range: [60, 255]}
    mineral_2_native:
      mapper: categorical
      on_unmapped: grey
      alpha_from: {band: mineral_2_native_agreement, domain: [0.25, 1.0], range: [60, 255]}
    iron_oxide:
      mapper: categorical
      on_unmapped: grey
      alpha_from: {band: iron_oxide_agreement, domain: [0.25, 1.0], range: [60, 255]}
    alteration:
      mapper: categorical
      on_unmapped: grey
      alpha_from: {band: alteration_agreement, domain: [0.25, 1.0], range: [60, 255]}
    mineral_family:
      mapper: categorical
      on_unmapped: grey
      alpha_from: {band: mineral_family_agreement, domain: [0.25, 1.0], range: [60, 255]}

budget:
  # Measured ceilings, set just above the real numbers so a scope change trips the gate rather
  # than quietly costing money. `require_approval` is specified but not built, so this fails.
  max_tiles: 450                  # 406 tiles are touched before the cloud filter, 402 after
  max_granules: 3600              # 3,430 intersect the box, 1,932 survive the filters
  max_vcpu_hours: 600             # DERIVED, not guessed: 85-193 local CPU-hours measured per stage
                                  #   at exactly this geometry, x2-2.5 for a Graviton2 Lambda core
                                  #   = 170-480 Lambda-hours. See README.md section 3.
  on_exceed: fail
