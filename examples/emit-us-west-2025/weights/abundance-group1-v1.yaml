# GENERATED abundance weights for `spectral_abundance`, group 1 only.
#
# NOT READ BY ANYTHING. This is the generator input and the provenance record for the numbers
# that appear INLINE under `reducer.params.weights` in manifest-proof-abundance.yaml. Reducer
# params are free-form by contract - the plugin defines them - so the framework has no `@ref:`
# for them the way a categorical layer's `classes:` does. The manifest's copy is what runs, what
# enters `manifest_hash`, and what reaches a worker through plan.json.
#
# Consequence: editing a weight means editing the manifest, and this file is how you know where
# those numbers came from. It lives in `weights/` and not `classes/` because everything in
# `classes/` IS loaded, by `@ref:`, and a file that looks loaded but is not is worse than no file.
#
# fraction = the XRD-measured weight fraction of that mineral in the library sample, from
# mineral_grouping_matrix_20230503.csv (the EMIT-10 Goethite and Hematite columns). A -1 in
# the matrix means 'unknown but non-zero' and is taken as 1.0, exactly as the LP DAAC L2B
# tutorial does. Keys are the constituent name the granule's own /mineral_metadata reports,
# never the integer index, so a re-delivered table resolves.
#
# 26 constituents; 1 of them reach MORE THAN ONE output class, which is the
# thing an Enumeration cannot express:
#   index 46: nHematit+fg-Goethit 34B2+MPC W1R1Hb -> {'goethite': 0.1, 'hematite': 0.05}

