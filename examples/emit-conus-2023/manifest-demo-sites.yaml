# Contender C on the reprocessed archive, over the four demonstration sites: the check to run
# before the same configuration goes to CONUS (manifest.yaml beside this one).
#
#     pixi run stratum validate -m examples/emit-conus-2023/manifest-demo-sites.yaml
#     make cloud-run-detached MANIFEST=examples/emit-conus-2023/manifest-demo-sites.yaml
#
# The method is the mode-gated selector with per-group votes, a soft gate and rank-normalised
# penalties - contender C of ../emit-cm-demo-sites/, whose walkthrough explains every step
# (../emit-cm-demo-sites/manifest-assistant-pick.walkthrough.html). The scorer block below is
# that contender's, unchanged. What differs is what it reads:
#
#   inputs    the reprocessed archive: L2B MIN, L1B OBS and FRCOV at V002, the L2A mask at V003
#   year      2023 - V002 does not yet cover 2025
#   cloud     the SpecTf flag with a two-pixel buffer, in place of cloud + dilated cloud
#   classes   Tetracorder 6's 312-entry table, read from each granule as before

run_id: cm-c-demo-sites-2023
description: Demonstration sites 2023 on V002 inputs and the V003 SpecTf mask, one annual epoch, contender C

grid:                               # the EMIT L3 gridded-reflectance lattice
  crs: EPSG:4326
  resolution: [0.00055, -0.00055]
  origin: [-0.000275, -0.000275]
  tile_size: 0.55
  block_size: 500                   # the memory knob for a stack scorer: resolve keeps every look's
                                    #   block window. `stratum plan` prints the estimate.
  regrid_method: kdtree

aoi:
  zones: [cuprite-nv, mountain-pass-ca, bingham-canyon-amd, mojave-l2b-tutorial]
  registry: ../zones.yaml

time:
  start: 2023-01-01
  end:   2024-01-01
  epoch: P1Y                        # ONE epoch: the consensus is over every look of the year
  deliver: P1Y

inputs:
  index_location: ./index-demo-sites
  source:
    kind: cmr
    provider: LPCLOUD
    prefer: https
    patterns:                       # the reprocessed archive: every product at V002, and the
      EMITL2BMIN:                   #   mask one version ahead at V003. Each collection also
        version: "002"              #   publishes the older version, so the version is pinned
        assets:                     #   here and the catalogue search is filtered on it.
          MIN: "EMIT_L2B_MIN_002_*.nc"
          MINUNCERT: "EMIT_L2B_MINUNCERT_002_*.nc"
      EMITL1BRAD:
        version: "002"
        assets:
          OBS: "EMIT_L1B_OBS_002_*.nc"
      EMITL2AMASK:
        version: "003"
        assets:
          MASK: "EMIT_L2A_MASK_003_*.nc"
      EMITL2BFRCOV:
        version: "002"
        assets:
          FRCOVBARE: "EMIT_L2B_FRCOVBARE_002_*.tif"
          FRCOVPV: "EMIT_L2B_FRCOVPV_002_*.tif"
          FRCOVNPV: "EMIT_L2B_FRCOVNPV_002_*.tif"
  roles:
    geometry: {collection: EMITL1BRAD, asset: OBS, var: obs}
    mineral_1:
      collection: EMITL2BMIN
      var: group_1_mineral_id
      class_table:
        source: embedded
        path: /mineral_metadata
        key: index
        attributes: [name, record, library, group]
        identity: [collection_version, build_version]
    depth_1: {collection: EMITL2BMIN, var: group_1_band_depth}
    mineral_2:
      collection: EMITL2BMIN
      var: group_2_mineral_id
      class_table:
        source: embedded
        path: /mineral_metadata
        key: index
        attributes: [name, record, library, group]
        identity: [collection_version, build_version]
    depth_2: {collection: EMITL2BMIN, var: group_2_band_depth}
    mineral_unc:   {collection: EMITL2BMIN, asset: MINUNCERT, var: group_1_band_depth_unc}
    mineral_2_unc: {collection: EMITL2BMIN, asset: MINUNCERT, var: group_2_band_depth_unc}
    mineral_fit:   {collection: EMITL2BMIN, asset: MINUNCERT, var: group_1_fit}
    mineral_2_fit: {collection: EMITL2BMIN, asset: MINUNCERT, var: group_2_fit}
    mask: {collection: EMITL2AMASK, var: mask}
    frcov: {collection: EMITL2BFRCOV, asset: FRCOVBARE, var: EMIT_L2B_FRCOVBARE, resampling: nearest}
    pv:    {collection: EMITL2BFRCOV, asset: FRCOVPV,   var: EMIT_L2B_FRCOVPV,   resampling: nearest}
    npv:   {collection: EMITL2BFRCOV, asset: FRCOVNPV,  var: EMIT_L2B_FRCOVNPV,  resampling: nearest}
  band_aliases:
    view_zenith:  {role: geometry, band: 2}
    solar_zenith: {role: geometry, band: 4}
    path_length:  {role: geometry, band: 0}
    cos_i:        {role: geometry, band: 8}
    cloud_prob:   {role: mask, match: {name: "SpecTf-Cloud Probability"}}   # by NAME: band 4 of
                                          #   the seven V003 carries, band 8 of V002's eleven

aux:
  landcover:
    uri:
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N33W120_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N33W117_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N36W120_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N36W117_Map.tif
      - https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N39W114_Map.tif
    kind: categorical
    resampling: mode

granule_filter:
  - {max_cloud_fraction: 0.8, on_missing: fail}
  - {max_solar_zenith: 70}

pixel_mask:
  - {ref: edge_trim, columns: 7}
  # Cloud is the SpecTf classifier's flag, not `cloud` + `dilated_cloud`: the dilated flag is a
  # fixed several-kilometre buffer and removes clear ground beside any cloud. `spectf_buffer`
  # trims the cloud's own margin instead, in sensor pixels; keep it at 3 or below. V003 carries
  # no spacecraft flag. If SpecTf proves too aggressive over bright ground, list `cloud` beside
  # `spectf_cloud` for the union of the two.
  - {ref: l2a_standard, flags: [spectf_cloud, cirrus, water], spectf_buffer: 2}
  - {ref: landcover, exclude: [water, built-up]}
  - {ref: cos_i, min_cos_i: 0.3}

scorer:
  ref: mode_gated_select
  params:
    layers: [mineral_1, mineral_2]
    key: independent                # each group is voted on its own
    ignore: {g1: [], g2: []}
    g2_mask_classes: []
    min_count: 1
    tie_break: weighted
    partial_vote_weight: 0.01
    partial_tie_penalty: 0.05
    gate: soft                      # a look carrying both modes first; any other look after
    soft_penalty: 10.0
    normalize: rank                 # each metric is the look's rank in its cell; `bounds` unused
    weights: {bd_unc: 0.2, fit: 0.2, banddepth: 0.2, cloud_prob: 0.2, scene_cloudiness: 0.2,
              bare: 0.2, sza: 0.2, vza: 0.2, path_length: 0.2, airmass: 0.2}
    bounds: {bd_unc: [0, 0.03], fit: [0, 0.5], banddepth: [0, 0.5], sza: [0, 70],
             vza: [0, 30], path_length: [402404, 452394], airmass: [2, 4]}
    aliases: {banddepth: [depth_1, depth_2]}   # this directory's role names; the rest are the defaults

snapshot:
  name: cm-c-v002-v1
  layers:
    mineral_1:
      kind: categorical
      source: mineral_1
      classes: source
      aggregate: {method: vote, min_count: 1, ignore: []}   # one epoch: the selected look's class
    mineral_2:
      kind: categorical
      source: mineral_2
      classes: source
      aggregate: {method: vote, min_count: 1, ignore: []}
    depth_1:
      kind: continuous
      source: depth_1
      aggregate: {method: best}
    depth_2:
      kind: continuous
      source: depth_2
      aggregate: {method: best}
    acquired_1:                     # the selected-granule map. One scene per cell for BOTH groups
      kind: continuous              #   here, so acquired_2 would be the same band and is omitted.
      source: acquired
      aggregate: {method: best}
    bare:                           # FRCOV pass-through: the cover of the selected look
      kind: continuous
      source: frcov
      aggregate: {method: best}
    pv:
      kind: continuous
      source: pv
      aggregate: {method: best}
    npv:
      kind: continuous
      source: npv
      aggregate: {method: best}
    mode_count:                     # the scorer's diagnostics (source: scorer.<output>)
      kind: continuous
      source: scorer.mode_count
      aggregate: {method: best}
    n_valid:
      kind: continuous
      source: scorer.n_valid
      aggregate: {method: best}
    agreement:
      kind: continuous
      source: scorer.agreement
      aggregate: {method: best}
    selection_penalty:
      kind: continuous
      source: scorer.selection_penalty
      aggregate: {method: best}

outputs:
  bucket: ./out
  formats: [cog]
  stac: true
  colors: "@ref:colors-usgs-1995.yaml"   # the 1995 USGS Cuprite groups; unnamed classes follow on_unmapped
  render:
    mineral_1:
      mapper: categorical
      on_unmapped: grey
      alpha_from: {band: agreement, domain: [0.25, 1.0], range: [60, 255]}
    mineral_2:
      mapper: categorical
      on_unmapped: grey
      alpha_from: {band: agreement, domain: [0.25, 1.0], range: [60, 255]}

budget:
  max_tiles: 24
  max_granules: 200
  max_vcpu_hours: 40
  on_exceed: fail
