# Contender C over the conterminous United States, calendar 2023: the scale test.
#
#     pixi run stratum validate -m examples/emit-conus-2023/manifest.yaml
#     make cloud-run-detached MANIFEST=examples/emit-conus-2023/manifest.yaml ARGS=--dry-run
#     make cloud-run-detached MANIFEST=examples/emit-conus-2023/manifest.yaml
#
# Identical to manifest-demo-sites.yaml except for the area, the land-cover tiles that cover it,
# the index and the budget (tests/test_examples.py pins that). Run the demonstration sites first.
#
# The method is the mode-gated selector with per-group votes, a soft gate and rank-normalised
# penalties - contender C of ../emit-cm-demo-sites/, whose walkthrough explains every step
# (../emit-cm-demo-sites/manifest-assistant-pick.walkthrough.html). The scorer block below is
# that contender's, unchanged. What differs is what it reads:
#
#   inputs    the reprocessed archive: L2B MIN, L1B OBS and FRCOV at V002, the L2A mask at V003
#   year      2023 - V002 does not yet cover 2025
#   cloud     the SpecTf flag with a two-pixel buffer, in place of cloud + dilated cloud
#   classes   Tetracorder 6's 312-entry table, read from each granule as before
#
# The area is a box, so it takes in the borderlands and open water as well; a tile no granule
# reaches costs one land-cover warp at plan time and nothing after. The dry run is the cost
# estimate: nothing about this run's cost or duration has been measured.

run_id: cm-c-conus-2023
description: CONUS 2023 on V002 inputs and the V003 SpecTf mask, one annual epoch, contender C

grid:                               # the EMIT L3 gridded-reflectance lattice
  crs: EPSG:4326
  resolution: [0.00055, -0.00055]
  origin: [-0.000275, -0.000275]
  tile_size: 0.55
  block_size: 500                   # the memory knob for a stack scorer: resolve keeps every look's
                                    #   block window. `stratum plan` prints the estimate.
  regrid_method: kdtree

aoi:
  bbox: [-125.0, 24.0, -66.0, 50.0]   # west, south, east, north

time:
  start: 2023-01-01
  end:   2024-01-01
  epoch: P1Y                        # ONE epoch: the consensus is over every look of the year
  deliver: P1Y

inputs:
  index_location: ./index
  source:
    kind: cmr
    provider: LPCLOUD
    prefer: https
    patterns:                       # the reprocessed archive: every product at V002, and the
      EMITL2BMIN:                   #   mask one version ahead at V003. Each collection also
        version: "002"              #   publishes the older version, so the version is pinned
        assets:                     #   here and the catalogue search is filtered on it.
          MIN: "EMIT_L2B_MIN_002_*.nc"
          MINUNCERT: "EMIT_L2B_MINUNCERT_002_*.nc"
      EMITL1BRAD:
        version: "002"
        assets:
          OBS: "EMIT_L1B_OBS_002_*.nc"
      EMITL2AMASK:
        version: "003"
        assets:
          MASK: "EMIT_L2A_MASK_003_*.nc"
      EMITL2BFRCOV:
        version: "002"
        assets:
          FRCOVBARE: "EMIT_L2B_FRCOVBARE_002_*.tif"
          FRCOVPV: "EMIT_L2B_FRCOVPV_002_*.tif"
          FRCOVNPV: "EMIT_L2B_FRCOVNPV_002_*.tif"
  roles:
    geometry: {collection: EMITL1BRAD, asset: OBS, var: obs}
    mineral_1:
      collection: EMITL2BMIN
      var: group_1_mineral_id
      class_table:
        source: embedded
        path: /mineral_metadata
        key: index
        attributes: [name, record, library, group]
        identity: [collection_version, build_version]
    depth_1: {collection: EMITL2BMIN, var: group_1_band_depth}
    mineral_2:
      collection: EMITL2BMIN
      var: group_2_mineral_id
      class_table:
        source: embedded
        path: /mineral_metadata
        key: index
        attributes: [name, record, library, group]
        identity: [collection_version, build_version]
    depth_2: {collection: EMITL2BMIN, var: group_2_band_depth}
    mineral_unc:   {collection: EMITL2BMIN, asset: MINUNCERT, var: group_1_band_depth_unc}
    mineral_2_unc: {collection: EMITL2BMIN, asset: MINUNCERT, var: group_2_band_depth_unc}
    mineral_fit:   {collection: EMITL2BMIN, asset: MINUNCERT, var: group_1_fit}
    mineral_2_fit: {collection: EMITL2BMIN, asset: MINUNCERT, var: group_2_fit}
    mask: {collection: EMITL2AMASK, var: mask}
    frcov: {collection: EMITL2BFRCOV, asset: FRCOVBARE, var: EMIT_L2B_FRCOVBARE, resampling: nearest}
    pv:    {collection: EMITL2BFRCOV, asset: FRCOVPV,   var: EMIT_L2B_FRCOVPV,   resampling: nearest}
    npv:   {collection: EMITL2BFRCOV, asset: FRCOVNPV,  var: EMIT_L2B_FRCOVNPV,  resampling: nearest}
  band_aliases:
    view_zenith:  {role: geometry, band: 2}
    solar_zenith: {role: geometry, band: 4}
    path_length:  {role: geometry, band: 0}
    cos_i:        {role: geometry, band: 8}
    cloud_prob:   {role: mask, match: {name: "SpecTf-Cloud Probability"}}   # by NAME: band 4 of
                                          #   the seven V003 carries, band 8 of V002's eleven

