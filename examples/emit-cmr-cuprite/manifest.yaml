# Stratum example: the Cuprite / Goldfield district of Nevada as SIX tiles, January-August 2026,
# granules discovered in NASA's CMR catalogue and downloaded from LP DAAC on first touch.
# Run from the repo root:
#
#     pixi run stratum index build -m examples/emit-cmr-cuprite/manifest.yaml   # metadata only
#     pixi run stratum plan        -m examples/emit-cmr-cuprite/manifest.yaml   # read report.md
#     pixi run stratum run         -m examples/emit-cmr-cuprite/manifest.yaml
#
# This is emit-cmr-nevada's science over a MULTI-TILE area: the same collections, roles, masks,
# scorer and monthly vote, changed only in geometry - a half-degree `tile_size`, the `block_size`
# that follows from it, and a `bbox` instead of an explicit tile list. Everything else being
# identical is the point: the fan-out over tiles is a property of the grid and the AOI, never of
# the pipeline. 719 work items against the single-tile example's 205.
#
# Every path below is relative to this file. README.md has the tile map and the measured cost.

run_id: emit-cmr-cuprite             # the run label; the run id is this plus a hash of the manifest
description: Cuprite/Goldfield NV as a 2 x 3 tile set from CMR - Jan-Aug 2026, monthly votes

grid:
  crs: EPSG:4326                                                # geographic degrees; every unit below is degrees
  resolution: [0.000277777777777778, -0.000277777777777778]   # one arcsecond - IDENTICAL to emit-cmr-nevada
  origin: [-180, -90]             # the same lattice too: cell edges fall at origin + n * resolution
  tile_size: 0.5                  # a half degree per tile: 1800 x 1800 cells (nevada uses 1.0)
                                  #   Tiles are cut on the CELL lattice, not on a lattice of their
                                  #   own, so changing tile_size re-cuts the same cells into
                                  #   different rectangles - no pixel moves, and no tile straddles
                                  #   a cell. Six half-degree tiles cover 1.0 x 1.5 degrees; the
                                  #   same 2 x 3 set at the delivered 1.0 would be 2 x 3 degrees
                                  #   and 89 granules instead of 45 (measured against CMR), which
                                  #   is more than an example should ask anyone to download.
  block_size: 450                 # cells per block edge: a tile is 4 x 4 blocks, so 96 blocks in all
                                  #   (nevada: 5 x 5 blocks in one tile = 25). Four times the work,
                                  #   spread over six products instead of one.

aoi:
  # [west, south, east, north] in degrees. The tiles are DERIVED: every tile whose nominal bounds
  # intersect the box, ordered south to north then west to east. This box sits exactly on tile
  # edges, so it resolves to a clean 2 wide x 3 tall set and pulls in no seventh tile:
  #
  #       38.50 +---------+---------+
  #             | -236,76 | -235,76 |
  #       38.00 +---------+---------+
  #             | -236,75 | -235,75 |  <- Cuprite (37.52 N, 117.23 W) is in this one
  #       37.50 +---------+---------+
  #             | -236,74 | -235,74 |
  #       37.00 +---------+---------+
  #          -118.00   -117.50   -117.00
  #
  bbox: [-118.0, 37.0, -117.0, 38.5]
  # tiles: [[-236, 74], [-235, 74], [-236, 75], [-235, 75], [-236, 76], [-235, 76]]
  #                                 # the same six, named outright. A tile index is a COUNT of
  #                                 # tile_size steps from the origin, which reads as whole degrees
  #                                 # only when tile_size is 1.0 - at 0.5 the indices are x2, which
  #                                 # is why `-236_75` names lon [-118.0, -117.5) and not degree
  #                                 # -236. Prefer bbox when the tiling follows from the area.
  # zones: [cuprite-nv]             # alternative: ../zones.yaml has an approximate district box.
  # registry: ../zones.yaml         #   It is 0.6 x 0.6 degrees, so it does NOT cut into 2 x 3;
  #                                 #   it is the delivered-product zone, not this demo's AOI.

time:
  start: 2026-01-01               # inclusive, UTC
  end:   2026-09-01               # exclusive
  epoch: P1M                      # the voting unit: one snapshot per calendar month
  deliver: P8M                    # one delivered product PER TILE over the whole eight months

inputs:
  index_location: ./index         # where the granule index lives; `stratum plan` builds it here if absent
  source:                         # how the index is BUILT (a run never talks to the catalogue)
    kind: cmr                     # NASA's Common Metadata Repository, through earthaccess
    provider: LPCLOUD             # the LP DAAC cloud provider that hosts EMIT
    prefer: https                 # download over HTTPS with Earthdata Login (s3 direct access is not built)
    patterns:                     # {collection: {asset: glob}}: which FILES of each record to index.
      EMITL2BMIN:                 #   A file matching no glob is never indexed or downloaded; a collection
        MIN: "EMIT_L2B_MIN_001_*.nc"            #   with no entry is not searched. The granule id is what `*`
        MINUNCERT: "EMIT_L2B_MINUNCERT_001_*.nc" #   matched on the first asset (e.g. 20260604T180210_2615512_009).
      EMITL1BRAD:                 #   OBS is the second file of an L1B RAD record; the 1.85 GB RAD file
        OBS: "EMIT_L1B_OBS_001_*.nc"            #   is deliberately unlisted, so it is never fetched.
  roles:                          # what the run reads: a name -> (collection, file, variable)
    geometry: {collection: EMITL1BRAD, asset: OBS, var: obs}   # view/sun angles per pixel; also the geolocation
    mineral:
      collection: EMITL2BMIN      # the MIN file (the collection's first asset) is implied
      var: group_1_mineral_id     # the group-1 mineral class per pixel
      class_table:                # the product's own class table, read from every granule
        source: embedded          # embedded in the file, never a checked-in CSV
        path: /mineral_metadata   # the NetCDF group holding it
        key: index                # the column the pixel values refer to
        attributes: [name, record, library, group, url]   # matched on these, never on the integer
    mineral_depth: {collection: EMITL2BMIN, var: group_1_band_depth}   # absorption depth of that class
  # Band indices are 0-BASED into the L1B OBS `obs` variable, whose bands are:
  #   0 path length, 1 to-sensor azimuth, 2 to-sensor zenith, 3 to-sun azimuth,
  #   4 to-sun zenith, 5 phase, 6 slope, 7 aspect, 8 cosine i, 9 UTC time,
  #   10 earth-sun distance.
  band_aliases:
    view_zenith:  {role: geometry, band: 2}   # how far off nadir the sensor looked
    solar_zenith: {role: geometry, band: 4}   # how high the sun was

# CMR carries CloudCover for every L2B granule, so this filter is real here (a local directory
# has no cloud fraction and would refuse every granule with on_missing: fail).
granule_filter:
  - {max_cloud_fraction: 0.8, on_missing: fail}   # drop granules more than 80 % cloudy; a missing value is an error

pixel_mask:
  - {ref: edge_trim, columns: 7}  # drop 7 detector columns at each cross-track edge (EMIT is a push-broom)

scorer:
  ref: min_view_zenith            # within a month, the observation closest to nadir wins each cell

snapshot:                         # what one month's snapshot holds, and how months are combined
  name: emit-cmr-cuprite-v1
  layers:
    mineral_1:
      kind: categorical
      source: mineral
      classes: source             # the granules' own class table; every granule must agree by fingerprint
      aggregate: {method: vote, min_count: 2, ignore: [none], tie_break: highest_score}
                                  # a cell needs 2 agreeing months; `none` (nothing identified) does not vote
    depth_1:
      kind: continuous
      source: mineral_depth
      aggregate: {method: median, conditional_on: mineral_1, spread: iqr}
                                  # median depth over the months that voted for the winner; spread = IQR
    view_zenith:
      kind: continuous
      source: view_zenith
      aggregate: {method: none}   # carried per month, not delivered as a product band

outputs:
  bucket: ./out                   # the storage root: assets/, cache/, runs/, products/ hang off it
  # gtiff, not cog, for the same reason as emit-cmr-nevada: this example exists to be looked at,
  # and a paletted COG is not readable by macOS ImageIO. Six tiles make that matter more, not
  # less - checking that the seams line up means opening all six. Delivered products use `cog`.
  formats: [gtiff]
  stac: true                      # a STAC item per product - so six items - and one collection per run
  render:
    mineral_1:
      mapper: categorical         # colour each class from the legend
      on_unmapped: grey           # a class the legend does not name is grey, not an error
      alpha_from: {band: mineral_1_agreement, domain: [0.25, 1.0], range: [60, 255]}
                                  # fade cells the months disagreed on

budget:                           # checked before the plan opens or downloads anything (on_exceed: warn proceeds)
  max_tiles: 6                    # the whole point of this example; nevada's ceiling is 1
  max_granules: 100
  max_vcpu_hours: 4
  on_exceed: fail
