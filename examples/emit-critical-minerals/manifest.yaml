# DESIGN TARGET, not runnable, and NOTIONAL in places. This is the full Critical Minerals
# product as designed (spec 09 is written around it); `stratum validate` lists what the framework
# does not build yet, and that list is the roadmap.
#
# Two different kinds of "not real" appear below, and the difference matters when reading it:
#
#   UNBUILT   - the feature is specified and the framework refuses it by name, so it cannot rot
#               silently. `validate` prints four: aux `s3://`, aux `temporal`, `formats:
#               [netcdf]`, `plugins.wheel`. `on_exceed: require_approval` is a fifth but only
#               bites at run time, when the executor refuses instead of parking the run.
#   NOTIONAL  - the VALUE is invented. Buckets, the wheel filename and the aux URIs name nothing
#               that exists, and no tool can tell you so. Each is marked `# NOTIONAL` at its line.
#
# Everything not marked either way is real and runs today. The runnable examples are
# ../emit-cmr-nevada/ (one tile) and ../emit-cmr-cuprite/ (three manifests). See README.md here.
run_id: cm-zones-2026-annual-r3
description: Critical Minerals annual mineral ID, 4 pilot zones

grid:
  crs: EPSG:4326
  resolution: [0.000277778, -0.000277778]   # one arcsecond
  tile_size: 1.0
  origin: [-180, -90]
  block_size: 720                  # divides the 3600-cell tile exactly
  max_distance: 0.00059       # regrid cutoff; default 1.5 x the grid diagonal - see 03 section 3
  regrid_method: kdtree       # kdtree | warp_embedded - see 03 section 3
  # force_positive_y: true    # only to defeat the guard rail in 01 section 1

aoi:
  zones: [bingham-canyon, cuprite-nv, leadville-co, south-central-az]
  registry: ../zones.yaml     # zone name -> [w, s, e, n]; relative to this file

time:
  start: 2022-08-01
  end:   2026-07-31
  epoch: P1M              # the voting unit - one snapshot per epoch
  deliver: P1Y            # == {every: P1Y, window: P1Y, align: exact}

# Long form, for a rolling composite delivered more often than the window slides:
#
# time:
#   epoch: P1M
#   deliver: {every: P1M, window: P13M, align: center}

inputs:
  index_location: s3://emit-l3/index/   # NOTIONAL bucket. What a RUN reads: a directory Stratum
                                        # writes. S3 access itself is also unbuilt (12 section 4).
  source:                                           # how that index is BUILT - see 12
    kind: cmr
    provider: LPCLOUD
    prefer: https                                   # https | direct (s3://, in-region only; not built)
    patterns:                     # which files of each record to index, by asset name;
      EMITL2BMIN:                 # a file matching no pattern is never indexed or fetched
        MIN: "EMIT_L2B_MIN_001_*.nc"
        MINUNCERT: "EMIT_L2B_MINUNCERT_001_*.nc"
      EMITL1BRAD:
        OBS: "EMIT_L1B_OBS_001_*.nc"                # the 1.85 GB RAD file is deliberately absent
      EMITL2AMASK:
        MASK: "EMIT_L2A_MASK_002_*.nc"
      EMITL2BFRCOV:
        FRCOVBARE: "EMIT_L2B_FRCOVBARE_001_*.tif"
  roles:
    geometry:       {collection: EMITL1BRAD,  asset: OBS, var: obs}   # CMR has no EMITL1BOBS: OBS is
                                                                     # the 2nd asset of EMITL1BRAD.001
    mineral:
      collection: EMITL2BMIN
      var: group_1_mineral_id
      class_table:                        # where this product keeps its own table
        source: embedded
        path: /mineral_metadata
        key: index
        attributes: [name, record, library, group, url]
    mineral_depth:  {collection: EMITL2BMIN,  var: group_1_band_depth}
    mineral_uncert: {collection: EMITL2BMIN,  asset: MINUNCERT, var: group_1_band_depth_unc}
    mask:           {collection: EMITL2AMASK, version: "002", var: mask}   # EMITL2AMASK is published
                                                                          # at collection version 002
    frcov:                        # ORTHO-NATIVE: already on a map grid, so no GLT and no KD-tree;
      collection: EMITL2BFRCOV    #   the framework warps it onto the block (12 section 2).
      asset: FRCOVBARE            #   Ships per-fraction GeoTIFFs (FRCOVBARE/PV/NPV + UNC twins,
      var: EMIT_L2B_FRCOVBARE     #   FRCOVQC); `var` is the band's description, not an index.
      resampling: bilinear        #   REQUIRED for an ortho role: ~60 m onto 1 arcsec upsamples
                                  #   by 1.95x, and a cover fraction is continuous.
  band_aliases:                 # 0-based band indices into the L1B OBS `obs` variable:
    view_zenith:  {role: geometry, band: 2}   # 2 = to-sensor zenith
    solar_zenith: {role: geometry, band: 4}   # 4 = to-sun zenith
    # swir_2200:  {role: reflectance, match: {wavelength: 2200}, tolerance: 10}   # by reader-reported attribute

# Aux itself IS built - ../emit-cmr-cuprite/manifest-bare-earth.yaml stages four real ESA
# WorldCover tiles over anonymous https and warps them per tile. What is not built is how these
# two want to be fetched, so `validate` refuses both:
aux:
  # NOTIONAL uri, and UNBUILT scheme: aux stages through the asset store, which opens https://
  # and file:// only. A slope raster is a static file, so this one becomes real the day someone
  # points it at a published DEM derivative - no framework change needed.
  slope: {uri: "s3://.../slope.tif", kind: continuous,  resampling: bilinear}
  # UNBUILT twice over. `{date}` + `temporal: nearest` means "find the nearest date that EXISTS",
  # which needs a listing, and a run never queries a catalogue (02 section 6). This is why
  # `cleanest_nadir` cannot run yet: it calls aux.raster("snow", date=...).
  snow:  {uri: "s3://.../snow/{date}.tif", kind: categorical, resampling: nearest,
          temporal: nearest, max_age: P3D}

# allow_mixed_vintage: true           # top level; requires a documented reason - see section 5

granule_filter:
  # - {build_version: "010635"}         # filterable, not required: the vintage check is the
  #                                     # class-table fingerprint - see 02 section 3
  - {max_cloud_fraction: 0.5, on_missing: fail}
  - {max_solar_zenith: 70}
  - {month_in: [8, 9, 10, 11]}          # recurring seasonal window, not an interval

pixel_mask:
  - {ref: edge_trim, columns: 7}               # sensor-space; detector edges
  - {ref: l2a_standard, flags: [cloud, cirrus, water, spacecraft]}
  - {ref: soil_fraction, min_soil: 0.65}       # refs: entry-point name, or module:Class

scorer:
  ref: cleanest_nadir
  params: {slope_penalty: 0.5}

snapshot:                                 # what resolve writes and how reduce collapses it - see 13
  name: cm-v1
  layers:
    mineral_1:
      kind: categorical
      source: mineral
      classes: "@ref:classes/cm-v1.yaml"  # the product enumeration; also the legend
      aggregate: {method: vote, min_count: 3, ignore: [none], tie_break: highest_score}
    depth_1:
      kind: continuous
      source: mineral_depth
      aggregate: {method: inverse_variance, unc: depth_1_unc, conditional_on: mineral_1, spread: iqr}
    depth_1_unc:
      kind: continuous
      source: mineral_uncert
      aggregate: {method: none}
    view_zenith:
      kind: continuous
      source: view_zenith
      aggregate: {method: none}

# reducer:  Reducer plugins ARE built, and ../emit-cmr-cuprite/manifest-joint.yaml is a working
#           one: JointMineralVote combines EMIT's two mineral groups, which no `aggregate` entry
#           can do. ClassifyLast is the case that stays out of reach, and NOT because of the
#           reducer - a snapshot stores only the WINNING observation, so the per-candidate
#           evidence classify-last needs was never written (04 section 4). Reaching it means
#           `source: scorer` layers and a full re-resolve, not a new reducer.
#   ref: my_package:ClassifyLast

outputs:
  bucket: s3://emit-l3-products         # NOTIONAL bucket
  formats: [cog, netcdf]
  stac: true
  render:
    mineral_1:
      mapper: categorical                 # classes come from the layer's enumeration
      on_unmapped: fail
      alpha_from: {band: mineral_1_agreement, domain: [0.3, 0.8], range: [60, 255]}

# UNBUILT, and the reason it is called out rather than deleted: `wheel` is the ITERATION
# delivery path (04 section 7) - publish a wheel, rerun, skip the image build. Today plugins
# resolve from entry points in the INSTALLED environment and nothing reads this key, so it is
# refused rather than ignored. The PRODUCTION path is built: `plugins/stratum-emit/` is a path
# dependency of the workspace, pinned in the image, named by digest.
plugins:
  wheel: s3://emit-l3/plugins/stratum_emit-0.4.2-py3-none-any.whl   # NOTIONAL: the real
                                        # distribution is stratum-emit 0.0.1, installed in-image

budget:
  max_tiles: 64
  max_granules: 12000
  max_vcpu_hours: 400
  on_exceed: require_approval
