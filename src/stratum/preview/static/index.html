<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stratum preview</title>
<!-- Pinned to exact versions, jsDelivr, classic scripts - the same rule the design site keeps
     for Mermaid. A range silently changes what renders; a module build would need a server. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>

<div id="map" role="application" aria-label="Product map"></div>

<!-- Over the map, not in the panel: the question "is this blank or still loading?" is
     asked while looking at the map. aria-live so it is announced rather than just seen. -->
<div id="tilestatus" role="status" aria-live="polite" hidden></div>

<!-- The layer stack, on the left: what "Add as layer" pins, top row drawn on top. Collapsed until
     the first layer is pinned, so someone who never stacks loses no map to it. -->
<aside id="stack" aria-label="Layers">
  <button id="stacktoggle" type="button" aria-expanded="false" aria-controls="stackbody">
    <span class="chev" aria-hidden="true"></span> Layers <span id="stackcount" class="badge">0</span>
  </button>
  <div id="stackbody" hidden>
    <div class="tools" role="toolbar" aria-label="Peek-through mask">
      <button id="toolrect" type="button" aria-pressed="false"
              title="Drag on the map to add a rectangle">Rectangle</button>
      <button id="toollasso" type="button" aria-pressed="false"
              title="Drag on the map to draw a freehand shape">Lasso</button>
      <button id="maskclear" type="button" title="Remove every shape">Clear</button>
      <label><input id="peek" type="checkbox" checked> Peek</label>
    </div>
    <p class="muted">Shapes cut a window in the <strong>top</strong> layer: it draws inside them
      and the layers beneath show everywhere else. Esc stops drawing.</p>
    <p id="maskmeta" class="muted"></p>
    <ol id="stacklist"></ol>
    <p id="stackempty" class="muted">Pick a run and a layer on the right, then
      <strong>Add as layer</strong>. Drag <span aria-hidden="true">⋮⋮</span> or use ↑ ↓ to
      reorder.</p>
  </div>
</aside>

<aside id="panel">
  <header>
    <h1><span class="glyph" aria-hidden="true"></span> Stratum</h1>
    <p id="root" class="muted">loading…</p>
  </header>

  <label for="run">Run</label>
  <select id="run"></select>
  <p id="runmeta" class="muted"></p>

  <label for="layer">Layer</label>
  <select id="layer"></select>
  <p id="layermeta" class="muted"></p>

  <label for="opacity">Opacity <output id="opacityval">100%</output></label>
  <input id="opacity" type="range" min="0" max="100" value="100">

  <div id="ramprow" hidden>
    <label for="ramp">Ramp</label>
    <select id="ramp"></select>
  </div>

  <button id="pin" type="button" disabled>Add as layer</button>

  <label for="basemap">Basemap</label>
  <select id="basemap">
    <option value="osm">OpenStreetMap</option>
    <option value="esri" selected>Esri imagery</option>
    <option value="none">None</option>
  </select>

  <label><input id="tiles" type="checkbox" checked> Show tile outlines</label>

  <div id="legend"></div>
  <p id="status" class="muted"></p>
</aside>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="viewer.js"></script>
</body>
</html>
